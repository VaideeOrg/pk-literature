name: Directus Bootstrap

# Runs apps/directus/scripts/bootstrap.ts (collections tracking,
# Catalog Editor/Senior Editor policies+roles+permissions, the
# staging->catalog promotion Flow) against a live Directus instance.
# Separate, manually-triggered workflow rather than chained onto
# terraform-apply.yml: bootstrap.ts needs Directus itself already up
# and healthy, and this repo's Directus deployment history (see
# apps/directus/README.md) has had enough boot-time instability that
# auto-chaining this immediately after an apply risked running against
# a container still mid-restart. Idempotent by design (bootstrap.ts's
# own header comment) - safe to re-run any time, including after
# adding new collections/policies/Flows to the script itself.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to run against. Only 'prod' is wired up right now, matching terraform-apply.yml's single-environment posture."
        required: true
        type: choice
        options:
          - prod
        default: prod

permissions:
  id-token: write
  contents: read

jobs:
  bootstrap:
    if: inputs.environment == 'prod'
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN_PROD }}
          aws-region: ap-southeast-1

      # ADMIN_EMAIL/ADMIN_PASSWORD, not a static DIRECTUS_TOKEN:
      # bootstrap.ts's own header comment documents a real historical
      # incident where these two could drift from the account actually
      # logged into in the browser, after repeated ECS restarts each
      # re-ran Directus's own bootstrap. That specific root cause (a
      # health-check misconfiguration causing runaway restart loops)
      # was fixed since (directus.tf's health_check_grace_period_
      # seconds), but no static long-lived token exists anywhere in
      # Secrets Manager/Terraform to use instead - the one used
      # manually throughout this repo's own development was a Personal
      # Access Token generated by hand via the Admin UI, never
      # provisioned as infrastructure. If this proves unreliable again,
      # the fix is provisioning and storing a real static token (a new
      # Secrets Manager secret + a one-time manual creation via the
      # Admin UI), not reverting this workflow to something else.
      - name: Fetch Directus admin password
        run: |
          PASSWORD=$(aws secretsmanager get-secret-value \
            --secret-id "/pk-literature/${{ inputs.environment }}/directus/admin-password" \
            --query SecretString --output text)
          echo "::add-mask::$PASSWORD"
          echo "DIRECTUS_ADMIN_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"

      - name: Run bootstrap
        working-directory: apps/directus
        env:
          # Matches secrets-manager module's directus_admin_email
          # variable default (terraform/modules/secrets-manager/
          # variables.tf) - not itself a secret (an email address,
          # already committed there), so it's fine hardcoded here the
          # same way terraform-apply.yml's web build step already
          # hardcodes the prod domain.
          DIRECTUS_URL: https://directus.puthagakadai.com
          DIRECTUS_ADMIN_EMAIL: www.vaidees@gmail.com
          # Same "not a secret, hardcoded here like the other prod
          # domain values above" reasoning - matches
          # terraform/modules/cloudfront's cdn.${domain_name} alias.
          # Only used to prefix the image-url display's src for fields
          # storing a bare S3 key (ensureImageThumbnailDisplays).
          CDN_BASE_URL: https://cdn.puthagakadai.com
        run: pnpm run bootstrap
