name: Run Database Migrations

# Manually-triggered invoke of the migration-runner Lambda
# (apps/migration-runner/README.md - "Not built or invoked by
# terraform-apply.yml. A migration run is a deliberate action, not a
# side effect of every infra apply - mirrors how build-directus-
# image.yml/build-medusa-image.yml are separate, manual-trigger-only
# workflows."). Replaces the manual `aws lambda invoke` this repo's own
# development has been running from CloudShell up to now.
#
# The Lambda's own deployment package is rebuilt automatically by
# terraform-apply.yml whenever any of the 5 services' migrations/
# files change (its cache key covers them - see that workflow's own
# "Cache migration-runner Lambda package" step), so a normal merge +
# apply already picks up new migrations; this workflow only invokes
# the (already up to date) Lambda.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to run against. Only 'prod' is wired up right now, matching terraform-apply.yml's single-environment posture."
        required: true
        type: choice
        options:
          - prod
        default: prod
      direction:
        description: "'up' runs pending migrations (all services). 'down' reverts the most recent migration per service, in reverse service order - same one-migration-at-a-time default as each service's own pnpm migrate:down, not a full rollback."
        required: true
        type: choice
        options:
          - up
          - down
        default: up

permissions:
  id-token: write
  contents: read

jobs:
  invoke:
    if: inputs.environment == 'prod'
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN_PROD }}
          aws-region: ap-southeast-1

      - name: Invoke migration-runner
        run: |
          if [ "${{ inputs.direction }}" = "down" ]; then
            PAYLOAD='{"direction":"down"}'
          else
            PAYLOAD='{}'
          fi

          aws lambda invoke \
            --function-name "pk-literature-${{ inputs.environment }}-migration-runner" \
            --cli-binary-format raw-in-base64-out \
            --payload "$PAYLOAD" \
            out.json

          cat out.json

      - name: Upload invocation output
        uses: actions/upload-artifact@v4
        with:
          name: migration-runner-output
          path: out.json
