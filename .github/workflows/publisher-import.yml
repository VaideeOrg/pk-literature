name: Publisher Import

# SPEC-04 §9 / ADR-009 — runs the external half of the publisher-import
# pipeline (discover/fetch/normalize/downloadCover, apps/publisher-crawler)
# entirely outside AWS, then POSTs to the staging-ingest API with
# SigV4-signed requests (terraform/environments/<env>/api-publisher-import.tf,
# terraform/bootstrap/gha-publisher-import.tf).
#
# The `schedule` cron trigger is commented out for now — no AWS
# environment has actually been applied yet, so a live cron would just
# fail against nothing every time it fired. Uncomment once prod (the
# only environment this repo stands up — see terraform-apply.yml's
# header) has real infrastructure and a real gha-publisher-import-prod
# role ARN in this repo's variables. Until then, workflow_dispatch is
# the only way to run this — same "manual gate first" posture as the
# deploy pipeline.
#
# on:
#   schedule:
#     - cron: "0 3 * * *"  # SPEC-04 §8's "Polling Frequency" is per-publisher
#                          # config in catalog.publishers, not expressible as a
#                          # single cron — this is a daily floor; a publisher
#                          # needing more frequent polling gets its own
#                          # schedule entry once that's a real requirement.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to run against. Only 'prod' is wired up right now, matching terraform-apply.yml's single-environment posture."
        required: true
        type: choice
        options:
          - prod
        default: prod
      publisher_id:
        description: "catalog.publishers.id (UUID) of the publisher to import."
        required: true
      publisher_code:
        description: "catalog.publishers.code — must match a registered adapter in apps/publisher-crawler/src/adapters-registry.ts."
        required: true
      trigger:
        description: "Recorded on the import_runs row (SPEC-04 §9)."
        required: true
        type: choice
        options:
          - manual
          - retry
        default: manual
      max_books:
        description: "Cap on books processed this run, across all discover() pages (0 = no limit). Testing aid for iterating on an adapter's discover()/normalize() fixes without crawling the whole catalogue; a limited run never advances last_import_cursor (run-import.ts)."
        required: false
        default: "0"

permissions:
  id-token: write
  contents: read

jobs:
  import-prod:
    if: inputs.environment == 'prod'
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Build adapter-sdk + publisher-crawler
        run: pnpm --filter @pk-literature/adapter-sdk --filter publisher-crawler run build
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PUBLISHER_IMPORT_ROLE_ARN_PROD }}
          aws-region: ap-southeast-1
      - name: Run import
        working-directory: apps/publisher-crawler
        env:
          PUBLISHER_ID: ${{ inputs.publisher_id }}
          PUBLISHER_CODE: ${{ inputs.publisher_code }}
          # Per-publisher base URL belongs in GitHub Actions environment
          # secrets/variables, one per publisher code
          # (infrastructure/secrets.md: "Per-publisher adapter
          # credentials... live in GitHub Actions secrets, not AWS
          # Secrets Manager"), not hardcoded here. Two publishers
          # registered so far (apps/publisher-crawler/src/adapters-registry.ts)
          # — selected by inputs.publisher_code; add another ternary arm
          # here (and a matching vars.<CODE>_BASE_URL) as more come online.
          PUBLISHER_BASE_URL: ${{ inputs.publisher_code == 'ethirveliyeedu' && vars.ETHIRVELIYEEDU_BASE_URL || vars.KALACHUVADU_BASE_URL }}
          STAGING_INGEST_BASE_URL: ${{ vars.STAGING_INGEST_BASE_URL_PROD }}
          AWS_REGION: ap-southeast-1
          IMPORT_TRIGGER: ${{ inputs.trigger }}
          MAX_BOOKS: ${{ inputs.max_books }}
        run: pnpm start
